services:
  postgres:
    image: postgres:16-alpine
    container_name: shipany-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: shipany
      POSTGRES_USER: shipany
      POSTGRES_PASSWORD: shipany_dev_password
    ports:
      - "5432:5432"
    volumes:
      - shipany_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipany -d shipany"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  shipany_postgres_data:
